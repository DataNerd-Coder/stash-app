<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Reports</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" style="padding-top:4px;">

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value">₦2.86M</div>
          <div class="stat-label">Revenue, last 30 days</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">₦612K</div>
          <div class="stat-label">Profit, last 30 days</div>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value">21.4%</div>
          <div class="stat-label">Average margin</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">₦94,600</div>
          <div class="stat-label">Total expenses</div>
        </div>
      </div>

      <div class="section-label" style="margin-top:24px;"><h2>Sales trend (7 days)</h2></div>
      <div class="sales-card" style="padding-top:16px;">
        <div class="mini-chart" style="margin-top:4px;">
          <div class="bar" style="height:38%"><span>M</span></div>
          <div class="bar" style="height:52%"><span>T</span></div>
          <div class="bar" style="height:44%"><span>W</span></div>
          <div class="bar" style="height:70%"><span>T</span></div>
          <div class="bar" style="height:60%"><span>F</span></div>
          <div class="bar" style="height:48%"><span>S</span></div>
          <div class="bar today" style="height:100%"><span>S</span></div>
        </div>
      </div>

      <div class="section-label"><h2>Best-performing products</h2></div>
      <div class="grouped-card" id="topList"></div>

      <div class="section-label"><h2>Expense breakdown</h2></div>
      <div class="grouped-card" id="expenseBreakdown"></div>

    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  document.getElementById("topList").innerHTML = STASH_MOCK.topProducts.map(p => `
    <div class="list-item">
      <div class="row-icon">${p.rank}</div>
      <div class="row-body">
        <div class="row-title">${p.name}</div>
        <div class="row-subtitle">${p.share}% of today's revenue</div>
      </div>
      <div class="row-trailing"><div class="prevenue">${formatNaira(p.revenue)}</div></div>
    </div>`).join("");

  const byCategory = {};
  STASH_MOCK.expenses.forEach(e => { byCategory[e.category] = (byCategory[e.category] || 0) + e.amount; });
  document.getElementById("expenseBreakdown").innerHTML = Object.entries(byCategory).map(([cat, amt]) => `
    <div class="list-item">
      <div class="row-body"><div class="row-title">${cat}</div></div>
      <div class="row-trailing"><div class="prevenue">${formatNaira(amt)}</div></div>
    </div>`).join("");
</script>
</body>
</html>
