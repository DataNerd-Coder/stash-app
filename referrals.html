<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Referrals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Referrals</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content no-chat-pad" style="padding-top:4px;">
      <p style="font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.5;">
        Share your link. When someone you refer signs up for Stash, you both get rewarded.
      </p>

      <div class="referral-link-box">
        <span id="refLink">stash.app/r/chidi-provisions</span>
        <button class="referral-copy-btn" onclick="copyRefLink()" id="copyBtn">Copy link</button>
      </div>

      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-value">6</div>
          <div class="stat-label">Successful referrals</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">₦9,000</div>
          <div class="stat-label">Rewards earned</div>
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-box" style="grid-column:1 / -1;">
          <div class="stat-value">₦1,500</div>
          <div class="stat-label">Pending rewards</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  function copyRefLink(){
    const text = document.getElementById("refLink").textContent;
    const btn = document.getElementById("copyBtn");
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy link", 1500);
      });
    }
  }
</script>
</body>
</html>
