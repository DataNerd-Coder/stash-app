<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Suppliers</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" style="padding-top:4px;">
      <p style="font-size:12.5px; color:var(--muted-2); margin:0 0 14px; font-weight:500; line-height:1.5;">
        Tell Stash about a new supplier or delivery any time to keep this updated.
      </p>
      <div id="discoveryInsight"></div>
      <div class="grouped-card" id="suppliersList"></div>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  const list = document.getElementById("suppliersList");
  list.innerHTML = STASH_MOCK.suppliers.map(s => `
    <div class="list-item">
      <div class="row-body">
        <div class="row-title">${s.name}</div>
        <div class="row-subtitle">${s.products.join(", ")}</div>
      </div>
      <div class="row-trailing">
        ${s.outstanding > 0
          ? `<div class="prevenue" style="color:var(--danger);">${formatNaira(s.outstanding)}</div><div class="pshare" style="color:var(--muted-2);">owed</div>`
          : `<span class="status-tag paid">Settled</span>`}
      </div>
    </div>`).join("");

  // supplier discovery — built only from real purchase history, never invented
  const offers = STASH_MOCK.supplierOffers || [];
  if (offers.length > 0){
    const o = offers[0];
    const savings = o.usualCost - o.offerCost;
    document.getElementById("discoveryInsight").innerHTML = `
      <div class="insight-card" style="margin-bottom:20px;">
        <div class="insight-icon"><img src="assets/logo-icon.png" alt="Stash"></div>
        <div class="insight-body">
          <div class="insight-eyebrow">Stash noticed</div>
          <div class="insight-title">You normally buy ${o.product} for ${formatNaira(o.usualCost)}.</div>
          <div class="insight-subtitle">${o.supplier} is offering it for ${formatNaira(o.offerCost)} \u2014 a saving of ${formatNaira(savings)} per unit.</div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
