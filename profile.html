<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Profile Details</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content no-chat-pad" style="padding-top:4px;">

      <div class="profile-hero">
        <div class="profile-avatar" id="profileAvatar">M</div>
        <h2 id="profileBizName">Chidi's Provisions</h2>
        <p id="profileOwnerName">Michael Chidi</p>
        <button class="profile-edit-btn">Edit Details</button>
      </div>

      <div class="settings-group-label">Business</div>
      <div class="grouped-card">
        <div class="list-item">
          <div class="row-body">
            <div class="row-title">Business name</div>
            <div class="row-subtitle" id="rowBizName">Chidi's Provisions</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body">
            <div class="row-title">Owner's name</div>
            <div class="row-subtitle" id="rowOwnerName">Michael Chidi</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body">
            <div class="row-title">Phone number</div>
            <div class="row-subtitle" id="rowPhone">0803 123 4567</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body">
            <div class="row-title">Email address</div>
            <div class="row-subtitle" id="rowEmail">michael@chidisprovisions.com</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <div class="settings-group-label">Security</div>
      <div class="grouped-card">
        <div class="list-item">
          <div class="row-body"><div class="row-title">Change password</div></div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body"><div class="row-title">Change phone number</div></div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body">
            <div class="row-title">Two-factor authentication</div>
            <div class="row-subtitle">Off</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="list-item">
          <div class="row-body"><div class="row-title">Active sessions</div></div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  const biz = StashSession.getBusiness();
  if (biz && biz.ownerName) STASH_MOCK.user.firstName = biz.ownerName.split(" ")[0];
  if (biz && biz.businessName) STASH_MOCK.user.businessName = biz.businessName;

  const ownerFull = (biz && biz.ownerName) ? biz.ownerName : (STASH_MOCK.user.firstName + " " + STASH_MOCK.user.lastName);
  const bizName = STASH_MOCK.user.businessName;
  const phone = (biz && biz.phone) ? biz.phone : STASH_MOCK.user.phone;

  document.getElementById("profileAvatar").textContent = ownerFull.charAt(0).toUpperCase();
  document.getElementById("profileBizName").textContent = bizName;
  document.getElementById("profileOwnerName").textContent = ownerFull;
  document.getElementById("rowBizName").textContent = bizName;
  document.getElementById("rowOwnerName").textContent = ownerFull;
  document.getElementById("rowPhone").textContent = phone;
  document.getElementById("rowEmail").textContent = STASH_MOCK.user.email;
</script>
</body>
</html>
