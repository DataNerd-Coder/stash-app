<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="header">
      <a href="dashboard.html" class="back-btn" aria-label="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Menu</div>
      <a href="profile.html" class="avatar" id="menuAvatar" aria-label="Profile">M</a>
    </div>

    <div class="content no-chat-pad" style="padding-top:4px;">

      <div class="drawer-group-label" style="margin-top:0;">Business</div>
      <div class="grouped-card">
        <a href="products.html" class="list-item"><div class="row-body"><div class="row-title">Products</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="stockrecords.html" class="list-item"><div class="row-body"><div class="row-title">Stock Records</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="sales.html" class="list-item"><div class="row-body"><div class="row-title">Sales</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="expenses.html" class="list-item"><div class="row-body"><div class="row-title">Expenses</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="debts.html" class="list-item"><div class="row-body"><div class="row-title">Debts</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="suppliers.html" class="list-item"><div class="row-body"><div class="row-title">Suppliers</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="invoices.html" class="list-item"><div class="row-body"><div class="row-title">Invoices</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="reports.html" class="list-item"><div class="row-body"><div class="row-title">Reports</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="bank.html" class="list-item"><div class="row-body"><div class="row-title">Bank</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>

      <div class="drawer-group-label">Account</div>
      <div class="grouped-card">
        <a href="profile.html" class="list-item"><div class="row-body"><div class="row-title">Profile Details</div><div class="row-subtitle" id="profileRowSub">Chidi's Provisions · Michael Chidi</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>

      <div class="drawer-group-label">More</div>
      <div class="grouped-card">
        <a href="referrals.html" class="list-item"><div class="row-body"><div class="row-title">Referrals</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="privacy.html" class="list-item"><div class="row-body"><div class="row-title">Privacy</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="terms.html" class="list-item"><div class="row-body"><div class="row-title">Terms of Service</div></div><svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>

      <div style="margin-top:24px;">
        <div class="grouped-card">
          <div class="list-item danger-text" style="cursor:pointer;" onclick="openSignOutModal()">
            <div class="row-icon danger">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 8V6C15 4.9 14.1 4 13 4H6C4.9 4 4 4.9 4 6V18C4 19.1 4.9 20 6 20H13C14.1 20 15 19.1 15 18V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 12H21M21 12L17.5 8.5M21 12L17.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="row-body"><div class="row-title">Sign Out</div></div>
          </div>
        </div>
      </div>

    </div>

    <!-- ===== Sign out confirmation modal ===== -->
    <div class="modal-overlay" id="signOutModal">
      <div class="modal-card">
        <h3>Sign out of Stash?</h3>
        <p>You'll need to sign back in to see your business data.</p>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeSignOutModal()">Cancel</button>
          <button class="btn-danger" onclick="confirmSignOut()">Sign Out</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  const biz = StashSession.getBusiness();
  if (biz && biz.ownerName) STASH_MOCK.user.firstName = biz.ownerName.split(" ")[0];
  if (biz && biz.businessName) STASH_MOCK.user.businessName = biz.businessName;

  document.getElementById("menuAvatar").textContent = STASH_MOCK.user.firstName.charAt(0).toUpperCase();
  document.getElementById("profileRowSub").textContent = `${STASH_MOCK.user.businessName} \u00B7 ${(biz && biz.ownerName) ? biz.ownerName : STASH_MOCK.user.firstName + " " + STASH_MOCK.user.lastName}`;
</script>

</body>
</html>
