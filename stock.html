<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Almost Out of Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Almost out of stock</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" style="padding-top:4px;">
      <p style="font-size:12.5px; color:var(--muted-2); margin:0 0 14px; font-weight:500;">Lowest stock first</p>
      <div class="grouped-card" id="fullStockList"></div>

      <button class="btn-primary" style="margin-top:22px;" onclick="window.location.href='dashboard.html?openChat=1'">Ask Stash to help me restock</button>
    </div>

  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  const list = document.getElementById("fullStockList");
  const sorted = [...STASH_MOCK.lowStock].sort((a,b) => a.pct - b.pct);
  sorted.forEach(s => {
    const row = document.createElement("div");
    row.className = "list-item" + (s.level === "danger" ? " danger-row" : "");
    row.innerHTML = `
      <div class="row-icon ${s.level}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8.5C4 7.7 4.5 7 5.3 6.7L11.3 4.3C11.7 4.1 12.3 4.1 12.7 4.3L18.7 6.7C19.5 7 20 7.7 20 8.5V16C20 16.8 19.5 17.5 18.7 17.8L12.7 20.2C12.3 20.4 11.7 20.4 11.3 20.2L5.3 17.8C4.5 17.5 4 16.8 4 16V8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4.5 7.5L12 11L19.5 7.5M12 11V20.3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <div class="row-body">
        <div class="row-title">${s.name}</div>
        <div class="stock-bar-track"><div class="stock-bar-fill ${s.level === 'danger' ? 'low' : ''}" style="width:${s.pct}%"></div></div>
      </div>
      <div class="row-trailing">
        <div class="stock-remaining">${s.remaining}</div>
      </div>`;
    list.appendChild(row);
  });
</script>

</body>
</html>
