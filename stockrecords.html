<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Stock Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Stock Records</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" style="padding-top:4px;">
      <div class="tab-row" id="periodTabs">
        <button class="tab-chip" data-period="today">Today</button>
        <button class="tab-chip active" data-period="7d">Last 7 days</button>
        <button class="tab-chip" data-period="month">This month</button>
        <button class="tab-chip" data-period="all">All</button>
        <button class="tab-chip" data-period="custom">Custom</button>
      </div>

      <div class="grouped-card" style="padding:14px 14px 6px;">
        <table class="data-table">
          <thead>
            <tr><th>Product</th><th>Purchased</th><th>Sold</th><th>Remaining</th></tr>
          </thead>
          <tbody id="stockTableBody"></tbody>
        </table>
      </div>
      <p style="font-size:11.5px; color:var(--muted-2); margin:12px 4px 0; line-height:1.5;">
        "Remaining" is your current actual stock. Purchased and Sold reflect the selected period.
      </p>
    </div>

  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  // mock: scale purchased/sold slightly per period to simulate a rolling range without real dates
  const scaleByPeriod = { today: 0.18, "7d": 1, month: 3.4, all: 6, custom: 1 };

  function renderStockTable(period){
    const body = document.getElementById("stockTableBody");
    const scale = scaleByPeriod[period] ?? 1;
    body.innerHTML = STASH_MOCK.stockRecords.map(r => `
      <tr>
        <td>${r.product}</td>
        <td>${Math.round(r.purchased * scale)}</td>
        <td>${Math.round(r.sold * scale)}</td>
        <td>${r.remaining}</td>
      </tr>`).join("");
  }

  renderStockTable("7d");
  document.querySelectorAll("#periodTabs .tab-chip").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll("#periodTabs .tab-chip").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderStockTable(tab.dataset.period);
    };
  });
</script>

</body>
</html>
