<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Bank</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" id="bankContent" style="padding-top:4px;"></div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  const el = document.getElementById("bankContent");

  function statusLabel(t){
    if (t.status === "matched") return '<span class="status-tag paid">Matched</span>';
    if (t.status === "review") return '<span class="status-tag draft">Needs review</span>';
    return '<span class="status-tag outstanding">Unmatched</span>';
  }

  function renderConnected(){
    const b = STASH_MOCK.bankAccount;
    el.innerHTML = `
      <div class="bank-account-card">
        <div class="bank-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 10L12 4L21 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10V19M9 10V19M15 10V19M19.5 10V19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3 19H21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </div>
        <div class="bank-info">
          <div>${b.bankName} •••• ${b.accountTail}</div>
          <div>Connected \u2014 comparing bank activity with your Stash records</div>
        </div>
      </div>

      <div class="section-label" style="margin-top:0;"><h2>Recent transactions</h2></div>
      <div class="grouped-card" id="txnList"></div>

      <p style="font-size:11.5px; color:var(--muted-2); margin:14px 4px 0; line-height:1.5;">
        Stash only reconciles a transaction when you confirm it. Nothing is matched automatically without your say-so.
      </p>
    `;

    const list = document.getElementById("txnList");
    list.innerHTML = STASH_MOCK.bankTransactions.map((t, i) => `
      <div class="list-item">
        <div class="row-body">
          <div class="row-title">${t.description}</div>
          <div class="row-subtitle">${t.date}${t.matchedTo ? " · " + t.matchedTo : ""}</div>
        </div>
        <div class="row-trailing" style="display:flex; align-items:center; gap:8px; flex-direction:row;">
          <div style="text-align:right;">
            <div class="prevenue" style="color:${t.amount < 0 ? 'var(--danger)' : 'var(--ink)'};">${t.amount < 0 ? "-" : ""}${formatNaira(Math.abs(t.amount))}</div>
            <div style="margin-top:4px;">${statusLabel(t)}</div>
          </div>
          ${t.status !== "matched" ? `<button class="recon-btn" onclick="reconcile(${i})">Reconcile</button>` : ""}
        </div>
      </div>`).join("");
  }

  function renderDisconnected(){
    el.innerHTML = `
      <div style="text-align:center; padding:40px 12px 20px;">
        <div class="onboard-art" style="width:110px; height:110px; margin:0 auto 20px;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M3 10L12 4L21 10" stroke="#0F5D46" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10V19M9 10V19M15 10V19M19.5 10V19" stroke="#0F5D46" stroke-width="1.6" stroke-linecap="round"/><path d="M3 19H21" stroke="#0F5D46" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h1 style="font-size:17px; margin:0 0 8px;">Connect your bank</h1>
        <p style="font-size:13px; color:var(--muted); line-height:1.5; margin:0 0 20px;">
          Stash can compare your bank activity with your business records and flag anything that needs a second look \u2014 you stay in control of every match.
        </p>
        <button class="btn-primary" onclick="STASH_MOCK.bankConnected = true; renderConnected();">Connect bank account</button>
      </div>`;
  }

  function reconcile(i){
    STASH_MOCK.bankTransactions[i].status = "matched";
    STASH_MOCK.bankTransactions[i].matchedTo = STASH_MOCK.bankTransactions[i].matchedTo || "Confirmed by you";
    renderConnected();
  }

  STASH_MOCK.bankConnected ? renderConnected() : renderDisconnected();
</script>
</body>
</html>
