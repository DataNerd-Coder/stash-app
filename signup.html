<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Set up your business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="header">
      <a href="welcome.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Set up your business</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content no-chat-pad" style="padding-top:8px;">
      <p style="font-size:13.5px; color:var(--muted); margin:0 0 22px; line-height:1.5;">
        This is just so Stash knows what to call you. You can always change it later.
      </p>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="ownerName" placeholder="e.g. Michael Chidi" required>
        </div>
        <div class="field">
          <label>Business name</label>
          <input type="text" id="businessName" placeholder="e.g. Chidi's Provisions" required>
        </div>
        <div class="field">
          <label>Phone number</label>
          <input type="tel" id="phone" placeholder="080X XXX XXXX" required>
        </div>

        <button type="submit" class="btn-primary" style="margin-top:8px;">Create my dashboard</button>
      </form>
    </div>

  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script>
  function handleSignup(e){
    e.preventDefault();
    const ownerName = document.getElementById("ownerName").value.trim();
    const businessName = document.getElementById("businessName").value.trim();
    const phone = document.getElementById("phone").value.trim();

    StashSession.saveBusiness({ ownerName, businessName, phone });
    StashSession.markOnboarded();

    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
