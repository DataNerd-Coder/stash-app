<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="device">
  <div class="screen">

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="0.5" fill="currentColor" opacity="0.35"/></svg>
        <svg width="17" height="11" viewBox="0 0 24 16" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="14.5" height="7" rx="1.3" fill="currentColor"/><rect x="21.5" y="4.5" width="1.6" height="3" rx="0.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="header">
      <a href="dashboard.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="header-title">Products</div>
      <div style="width:36px;"></div>
    </div>

    <div class="content" style="padding-top:4px;">
      <div class="tab-row" id="filterTabs">
        <button class="tab-chip active" data-filter="all">All</button>
        <button class="tab-chip" data-filter="attention">Needs attention</button>
      </div>
      <div class="grouped-card" id="productsList"></div>
    </div>

  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  mountStashChat();
  function badgeFor(p){
    if (p.expired) return '<span class="badge badge-expired">Expired</span>';
    if (p.expiryDays !== null && p.expiryDays <= 7) return `<span class="badge badge-soon">Expires in ${p.expiryDays} day${p.expiryDays===1?"":"s"}</span>`;
    return "";
  }

  function renderProducts(filter){
    const list = document.getElementById("productsList");
    list.innerHTML = "";
    let items = STASH_MOCK.products;
    if (filter === "attention"){
      items = items.filter(p => p.expired || (p.expiryDays !== null && p.expiryDays <= 7));
    }
    if (items.length === 0){
      list.innerHTML = '<div class="empty-state">Nothing to show here.</div>';
      return;
    }
    items.forEach(p => {
      const row = document.createElement("div");
      row.className = "list-item";
      row.innerHTML = `
        <div class="row-body">
          <div class="row-title">${p.name}</div>
          <div class="row-subtitle">${p.qty} · ${formatNaira(p.cost)}/${p.costUnit}</div>
        </div>
        <div class="row-trailing">${badgeFor(p)}</div>`;
      list.appendChild(row);
    });
  }

  renderProducts("all");
  document.querySelectorAll("#filterTabs .tab-chip").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll("#filterTabs .tab-chip").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderProducts(tab.dataset.filter);
    };
  });
</script>

</body>
</html>
